name: Lock Refresh Candidate

on:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "uv==0.8.13"
      - name: Resolve candidate lock
        run: uv lock
      - name: Upload candidate lock
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock-candidate
          path: uv.lock
          retention-days: 1
