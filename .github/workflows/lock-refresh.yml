name: Lock Refresh Candidate

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "uv==0.8.13"
      - name: Resolve lock from declared dependencies
        run: uv lock
      - name: Commit changed lock to the PR branch
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "STD-03: synchronize uv lock"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
