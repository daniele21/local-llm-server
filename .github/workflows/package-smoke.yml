name: Package Install Smoke

on:
  pull_request:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.8.13"

jobs:
  fresh-install:
    name: Fresh-install wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned uv bootstrap
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked package toolchain
        run: uv sync --frozen --extra dev --no-install-package llama-cpp-python
      - name: Build identified wheel/sdist
        env:
          LOCAL_LLM_BUILD_CHANNEL: package-smoke
          LOCAL_LLM_BUILD_VARIANT: wheel-sdist
        run: uv run --no-sync python scripts/build_artifacts.py --output-root dist --channel package-smoke --variant wheel-sdist
      - name: Install built wheel into a fresh environment and smoke it
        shell: bash
        run: |
          build_dir="$(find dist/builds -mindepth 2 -maxdepth 2 -type d | head -n 1)"
          test -n "$build_dir"
          wheel="$(find "$build_dir/package" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          version="$(tr -d '[:space:]' < VERSION)"
          uv run --no-sync python scripts/smoke_installed_artifact.py \
            --wheel "$wheel" \
            --expected-version "$version"
      - name: Remove package-smoke output
        if: always()
        run: rm -rf dist build src/*.egg-info
