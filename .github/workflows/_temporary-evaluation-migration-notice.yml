name: Temporary evaluation migration notice patcher

on:
  push:
    branches: [feat/evaluation-deprecation-notice]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evaluation-deprecation-notice
      - name: Add non-destructive Performance Lab migration notice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('src/local_llm_server/static/control-plane-evaluation.js')
          script = script_path.read_text(encoding='utf-8')

          helper_anchor = '\n    function renderForm(view, testSets, models, runIds) {'
          helper = '''
    function migrationNotice() {
        return `
            <div class="ds-card evaluation-context" data-evaluation-migration-notice>
                <span class="evaluation-eyebrow">Evaluation ownership transition</span>
                <h3>New evaluation work moves to Performance Lab</h3>
                <p>This Local LLM Server surface remains available for the current EV-3 evidence wave and legacy history. New post-cutover evaluation evidence belongs in Performance Lab.</p>
                <a class="ds-button ds-button--small" href="https://github.com/daniele21/performance-lab" target="_blank" rel="noreferrer">Open Performance Lab</a>
            </div>`;
    }

    function renderForm(view, testSets, models, runIds) {'''
          if script.count(helper_anchor) != 1:
              raise SystemExit('renderForm anchor mismatch')
          script = script.replace(helper_anchor, '\n' + helper, 1)

          unavailable_anchor = '''            <div class="ds-empty control-plane-unavailable">
                ${escapeHtml(adminHint)} No synthetic scores are displayed.
            </div>`;'''
          unavailable_replacement = '''            ${migrationNotice()}
            <div class="ds-empty control-plane-unavailable">
                ${escapeHtml(adminHint)} No synthetic scores are displayed.
            </div>`;'''
          if script.count(unavailable_anchor) != 1:
              raise SystemExit('unavailable anchor mismatch')
          script = script.replace(unavailable_anchor, unavailable_replacement, 1)

          layout_anchor = '''            </div>

            <div class="evaluation-layout">'''
          layout_replacement = '''            </div>

            ${migrationNotice()}

            <div class="evaluation-layout">'''
          if script.count(layout_anchor) != 1:
              raise SystemExit('form layout anchor mismatch')
          script = script.replace(layout_anchor, layout_replacement, 1)
          script_path.write_text(script, encoding='utf-8')

          test_path = Path('tests/test_evaluation_ui_assets.py')
          tests = test_path.read_text(encoding='utf-8')
          test_anchor = '\n\ndef test_evaluation_ui_exposes_progressive_sample_details():'
          new_test = '''


def test_evaluation_ui_surfaces_performance_lab_transition_without_disabling_legacy_evidence():
    script = (STATIC / "control-plane-evaluation.js").read_text(encoding="utf-8")
    assert "data-evaluation-migration-notice" in script
    assert "New evaluation work moves to Performance Lab" in script
    assert "current EV-3 evidence wave and legacy history" in script
    assert "New post-cutover evaluation evidence belongs in Performance Lab" in script
    assert "https://github.com/daniele21/performance-lab" in script
    assert "/api/v1/evaluation/runs" in script


def test_evaluation_ui_exposes_progressive_sample_details():'''
          if tests.count(test_anchor) != 1:
              raise SystemExit('test insertion anchor mismatch')
          tests = tests.replace(test_anchor, new_test, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
          node --check src/local_llm_server/static/control-plane-evaluation.js
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_temporary-evaluation-migration-notice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local_llm_server/static/control-plane-evaluation.js tests/test_evaluation_ui_assets.py .github/workflows/_temporary-evaluation-migration-notice.yml
          git diff --cached --quiet && exit 0
          git commit -m "Surface Performance Lab evaluation transition"
          git push origin HEAD:feat/evaluation-deprecation-notice
