name: CI

on:
  push:
    branches: ["main", "master", "dev", "docs/control-plane-positioning-ux-plan"]
  pull_request:

env:
  UV_VERSION: "0.8.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned uv bootstrap
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked deterministic development environment
        # llama-cpp-python is intentionally omitted from hosted deterministic CI:
        # compiling the native backend is not required to prove backend-neutral
        # product contracts and would make the normal gate hardware/toolchain-heavy.
        run: uv sync --frozen --extra dev --no-install-package llama-cpp-python
      - name: Run blocking Ruff correctness gate
        # The repository has pre-existing style/modernization debt. Keep merge
        # validation blocking on syntax and high-confidence Pyflakes failures
        # while that debt is paid down in dedicated slices.
        run: uv run --frozen ruff check src/ tests/ --select E9,F63,F7,F82

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv bootstrap
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked deterministic test environment
        run: uv sync --frozen --extra dev --no-install-package llama-cpp-python
      - name: Run deterministic unit tests
        run: uv run --frozen pytest tests/ -v --tb=short

  browser-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned uv bootstrap
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked deterministic product fixture environment
        run: uv sync --frozen --extra dev --no-install-package llama-cpp-python
      - name: Install locked Playwright dependency and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Run browser E2E gate
        run: npm run test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failure
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
