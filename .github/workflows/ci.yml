name: CI

on:
  push:
    branches: ["main", "master", "dev", "docs/control-plane-positioning-ux-plan"]
  pull_request:

env:
  UV_VERSION: "0.8.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned uv bootstrap
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked deterministic development environment
        run: uv sync --frozen --extra dev --no-install-package llama-cpp-python
      - name: Run blocking Ruff correctness gate
        run: uv run --no-sync ruff check src/ tests/ --select E9,F63,F7,F82

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv bootstrap
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked deterministic test environment
        run: uv sync --frozen --extra dev --no-install-package llama-cpp-python
      - name: Run deterministic unit tests without implicit resync
        run: uv run --no-sync pytest tests/ -v --tb=short

  browser-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned uv bootstrap
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked deterministic product fixture environment
        run: uv sync --frozen --extra dev --no-install-package llama-cpp-python
      - name: Install locked Playwright dependency and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Run browser E2E gate without Python environment resync
        run: uv run --no-sync npm run test:e2e
      - name: Verify required UI journey screenshots and videos
        run: node tests/e2e/verify_media_evidence.js test-results/playwright-results.json
      - name: Verify zero E2E residue
        if: always()
        run: uv run --no-sync python tests/e2e/verify_residue.py
      - name: Prepare bounded privacy-safe E2E failure evidence
        if: failure()
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --no-sync python tests/e2e/prepare_failure_evidence.py
      - name: Upload bounded identity-bearing Playwright E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            test-results/**
            e2e-failure-evidence/**
