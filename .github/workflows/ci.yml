name: CI

on:
  push:
    branches: ["main", "master", "docs/control-plane-positioning-ux-plan"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Run blocking Ruff correctness gate
        # The repository has pre-existing style/modernization debt. Keep merge
        # validation blocking on syntax and high-confidence Pyflakes failures
        # while that debt is paid down in dedicated slices.
        run: ruff check src/ tests/ --select E9,F63,F7,F82

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        # llama-cpp-python has a heavy native build; install the package without
        # transitive runtime dependencies and provide only deterministic test deps.
        # Keep this explicit list aligned with runtime dependencies exercised by
        # the deterministic API suite (e.g. multipart form parsing for ASR).
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pyyaml fastapi uvicorn python-multipart pytest httpx ruff huggingface-hub
      - name: Run deterministic unit tests
        run: pytest tests/ -v --tb=short

  browser-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deterministic product fixture dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pyyaml fastapi uvicorn python-multipart httpx huggingface-hub
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser E2E gate
        run: npm run test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failure
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
