name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Run Ruff
        run: ruff check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        # llama-cpp-python has a heavy native build; install the package without
        # transitive runtime dependencies and provide only deterministic test deps.
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pyyaml fastapi uvicorn pytest httpx ruff
      - name: Run deterministic unit tests
        run: pytest tests/ -v --tb=short
